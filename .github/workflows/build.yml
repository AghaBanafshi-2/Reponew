name: 🟣 Purple Client - Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Release JAR
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: 📦 Cache Gradle & Forge
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-forge-${{ hashFiles('**/*.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-forge-

      # ── آنزیپ سورس کد ─────────────────────────────────────────────
      - name: 📂 Extract source zip
        run: |
          if [ -f "PurpleClient-1.8.9-forge.zip" ]; then
            echo "📦 Found zip, extracting..."
            unzip -o PurpleClient-1.8.9-forge.zip
            cp -rn PurpleClient/. ./ 2>/dev/null || true
          else
            echo "✅ Using repo files directly."
          fi

      # ── دانلود Forge MDK و گرفتن gradlew ─────────────────────────
      - name: ⬇️ Download Forge MDK & setup Gradle wrapper
        run: |
          FORGE_VER="1.8.9-11.15.1.2318-1.8.9"
          MDK_URL="https://maven.minecraftforge.net/net/minecraftforge/forge/${FORGE_VER}/forge-${FORGE_VER}-mdk.zip"

          echo "⬇️ Downloading Forge MDK from: $MDK_URL"
          curl -L --retry 3 --retry-delay 5 -o forge-mdk.zip "$MDK_URL"

          echo "📂 Extracting MDK..."
          unzip -o forge-mdk.zip -d forge-mdk/

          echo "🔧 Copying gradlew and gradle wrapper..."
          cp forge-mdk/gradlew ./gradlew
          cp -r forge-mdk/gradle ./gradle

          chmod +x gradlew
          echo "✅ gradlew ready: $(./gradlew --version | head -1)"

      # ── Setup Forge CI workspace ───────────────────────────────────
      - name: ⚙️ Setup Forge workspace
        run: ./gradlew setupCIWorkspace --no-daemon
        env:
          GRADLE_OPTS: "-Xmx2G -Xms512M"

      # ── Build JAR ─────────────────────────────────────────────────
      - name: 🔨 Build JAR
        run: ./gradlew build --no-daemon
        env:
          GRADLE_OPTS: "-Xmx2G -Xms512M"

      # ── پیدا کردن JAR ─────────────────────────────────────────────
      - name: 🔍 Find built JAR
        id: find_jar
        run: |
          JAR_PATH=$(find build/libs -name "*.jar" ! -name "*-sources*" ! -name "*-dev*" | head -1)
          JAR_NAME=$(basename "$JAR_PATH")
          echo "jar_path=$JAR_PATH" >> $GITHUB_OUTPUT
          echo "jar_name=$JAR_NAME" >> $GITHUB_OUTPUT
          echo "✅ JAR ready: $JAR_NAME ($(du -sh $JAR_PATH | cut -f1))"

      # ── آپلود به Artifacts ────────────────────────────────────────
      - name: 📤 Upload JAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: PurpleClient-JAR
          path: ${{ steps.find_jar.outputs.jar_path }}
          retention-days: 30

      # ── ساختن GitHub Release ──────────────────────────────────────
      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: "🟣 Purple Client ${{ github.ref_name }}"
          body: |
            ## 🟣 Purple Client ${{ github.ref_name }}

            ### 📦 نصب
            1. **Forge 1.8.9** نصب کن
            2. فایل `${{ steps.find_jar.outputs.jar_name }}` رو دانلود کن
            3. بذارش داخل پوشه `.minecraft/mods/`
            4. ماینکرفت رو با Forge 1.8.9 باز کن
            5. **Right Shift** برای باز کردن GUI

            ### ✨ ماژول‌ها
            FPS · CPS · Keystrokes · Coordinates · Speed · Ping · Compass · Clock · Armor Status · Potion Status · Hunger

            ---
            > 🤖 Built automatically with GitHub Actions
          files: ${{ steps.find_jar.outputs.jar_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}